<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Question Evaluation Interface | DBMS</title>
    <style>
        :root {
            --glass-bg: rgba(255, 255, 255, 0.06);
            --glass-bg-hover: rgba(255, 255, 255, 0.1);
            --glass-border: rgba(255, 255, 255, 0.12);
            --glass-border-hover: rgba(255, 255, 255, 0.22);
            --glass-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
            --accent: #38bdf8;
            --accent-dim: rgba(56, 189, 248, 0.7);
            --accent-glow: rgba(56, 189, 248, 0.25);
            --text-primary: rgba(255, 255, 255, 0.95);
            --text-secondary: rgba(255, 255, 255, 0.55);
            --text-muted: rgba(255, 255, 255, 0.35);
            --transition: all 0.3s ease;
            --blur: blur(14px);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #0f0c29 0%, #1a1a2e 40%, #16213e 70%, #0f3460 100%);
            background-attachment: fixed;
            min-height: 100vh;
            color: var(--text-primary);
            line-height: 1.6;
            display: flex;
            flex-direction: column;
        }

        .header {
            background: rgba(15, 12, 41, 0.75);
            color: var(--text-primary);
            padding: 1rem 2rem;
            border-bottom: 1px solid var(--glass-border);
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 2rem;
            backdrop-filter: var(--blur);
            -webkit-backdrop-filter: var(--blur);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .header-left {
            flex-shrink: 0;
        }

        .header-title {
            font-size: 1.125rem;
            font-weight: 600;
            letter-spacing: -0.01em;
            color: var(--text-primary);
        }

        .header-subtitle {
            font-size: 0.8125rem;
            color: var(--text-secondary);
            font-weight: 400;
        }

        .header-progress {
            flex: 1;
            max-width: 400px;
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }

        .header-progress-bar {
            background: rgba(255, 255, 255, 0.1);
            height: 6px;
            border-radius: 3px;
            overflow: hidden;
        }

        .header-progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #38bdf8, #818cf8);
            transition: width 0.3s;
            border-radius: 3px;
        }

        .header-progress-text {
            font-size: 0.75rem;
            color: var(--text-secondary);
            text-align: center;
        }

        .header-stats {
            display: flex;
            gap: 2rem;
            align-items: center;
            flex-shrink: 0;
        }

        .stat-box {
            text-align: center;
        }

        .stat-value {
            font-size: 1.25rem;
            font-weight: 700;
            color: var(--accent);
            margin-bottom: 0.125rem;
        }

        .stat-label {
            font-size: 0.6875rem;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 0.05em;
            font-weight: 500;
        }

        .main-layout {
            display: flex;
            flex: 1;
            overflow: hidden;
        }

        .sidebar {
            width: 280px;
            background: rgba(15, 12, 41, 0.5);
            border-right: 1px solid var(--glass-border);
            padding: 1.5rem;
            overflow-y: auto;
            flex-shrink: 0;
            backdrop-filter: var(--blur);
            -webkit-backdrop-filter: var(--blur);
        }

        .sidebar-section {
            margin-bottom: 1.25rem;
        }

        .sidebar-title {
            font-size: 0.75rem;
            font-weight: 600;
            color: var(--accent-dim);
            text-transform: uppercase;
            letter-spacing: 0.08em;
            margin-bottom: 0.6rem;
        }

        .control-group {
            margin-bottom: 0.75rem;
        }

        .control-group:last-child {
            margin-bottom: 0;
        }

        .control-label {
            font-size: 0.8125rem;
            font-weight: 500;
            color: var(--text-secondary);
            display: block;
            margin-bottom: 0.5rem;
        }

        input[type="text"], select, button {
            width: 100%;
            padding: 0.5rem 0.75rem;
            border: 1px solid var(--glass-border);
            border-radius: 8px;
            font-size: 0.875rem;
            transition: var(--transition);
            background: var(--glass-bg);
            color: var(--text-primary);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
        }

        input[type="text"]::placeholder {
            color: var(--text-muted);
        }

        input[type="text"]:focus, select:focus {
            outline: none;
            border-color: var(--accent);
            background: var(--glass-bg-hover);
            box-shadow: 0 0 0 3px var(--accent-glow);
        }

        select {
            color: var(--text-primary);
        }

        select option {
            background: #1a1a2e;
            color: var(--text-primary);
        }

        button {
            background: rgba(56, 189, 248, 0.15);
            color: var(--text-primary);
            border: 1px solid rgba(56, 189, 248, 0.25);
            cursor: pointer;
            font-weight: 500;
            margin-bottom: 0.5rem;
        }

        button:hover {
            background: rgba(56, 189, 248, 0.25);
            border-color: rgba(56, 189, 248, 0.45);
            transform: translateY(-1px);
        }

        .content-area {
            flex: 1;
            overflow-y: auto;
            padding: 2rem;
        }

        .container {
            max-width: 1200px;
        }

        .unit-section {
            margin-bottom: 1.5rem;
            border: 1px solid var(--glass-border);
            border-radius: 16px;
            background: var(--glass-bg);
            backdrop-filter: var(--blur);
            -webkit-backdrop-filter: var(--blur);
            overflow: hidden;
            box-shadow: var(--glass-shadow);
            transition: var(--transition);
        }

        .unit-section:hover {
            border-color: var(--glass-border-hover);
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.4);
        }

        .unit-header {
            background: rgba(56, 189, 248, 0.06);
            padding: 1.25rem 1.5rem;
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: var(--transition);
            user-select: none;
            border-bottom: 1px solid var(--glass-border);
        }

        .unit-header:hover {
            background: rgba(56, 189, 248, 0.1);
        }

        .unit-header.active {
            background: rgba(56, 189, 248, 0.18);
            color: var(--text-primary);
            border-bottom-color: rgba(56, 189, 248, 0.25);
        }

        .unit-title {
            display: flex;
            align-items: center;
            gap: 1rem;
            font-weight: 600;
            font-size: 1rem;
            color: var(--text-primary);
        }

        .unit-checkbox {
            width: 18px;
            height: 18px;
            cursor: pointer;
            accent-color: var(--accent);
        }

        .unit-info {
            font-size: 0.875rem;
            opacity: 0.7;
            color: var(--text-secondary);
        }

        .dropdown-icon {
            font-size: 1.2rem;
            transition: transform 0.3s ease;
            color: var(--accent);
        }

        .unit-header.active .dropdown-icon {
            transform: rotate(180deg);
        }

        .unit-content {
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.3s ease;
        }

        .unit-content.show {
            max-height: 100000px;
        }

        .subtopic-section {
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }

        .subtopic-section:last-child {
            border-bottom: none;
        }

        .subtopic-header {
            background: rgba(56, 189, 248, 0.02);
            padding: 0.875rem 1.5rem;
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: var(--transition);
            user-select: none;
        }

        .subtopic-header:hover {
            background: rgba(56, 189, 248, 0.05);
        }

        .subtopic-header.active {
            background: rgba(56, 189, 248, 0.08);
        }

        .subtopic-title {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            font-size: 0.875rem;
            font-weight: 500;
            color: var(--text-primary);
        }

        .subtopic-checkbox {
            width: 16px;
            height: 16px;
            cursor: pointer;
            accent-color: var(--accent);
        }

        .subtopic-stats {
            font-size: 0.8125rem;
            color: var(--text-secondary);
        }

        .subtopic-content {
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.3s ease;
            background: rgba(0, 0, 0, 0.1);
        }

        .subtopic-content.show {
            max-height: 100000px;
        }

        .question-item {
            padding: 0.75rem 1.5rem 0.75rem 3rem;
            border-bottom: 1px solid rgba(255, 255, 255, 0.03);
            transition: var(--transition);
        }

        .question-item:last-child {
            border-bottom: none;
        }

        .question-item:hover {
            background: rgba(56, 189, 248, 0.03);
        }

        .question-item.checked {
            background: rgba(56, 189, 248, 0.05);
            opacity: 0.6;
        }

        .question-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 1rem;
        }

        .question-left {
            display: flex;
            align-items: flex-start;
            gap: 0.75rem;
            flex: 1;
            max-width: 70%;
        }

        .question-right {
            display: flex;
            flex-wrap: wrap;
            gap: 0.5rem;
            align-items: center;
            justify-content: flex-end;
            max-width: 30%;
        }

        .question-checkbox {
            width: 18px;
            height: 18px;
            cursor: pointer;
            margin-top: 0.125rem;
            flex-shrink: 0;
            accent-color: var(--accent);
        }

        .question-id {
            font-size: 0.8125rem;
            color: var(--accent-dim);
            font-weight: 600;
            flex-shrink: 0;
            min-width: 60px;
            margin-top: 0.125rem;
        }

        .question-text {
            font-size: 0.875rem;
            color: var(--text-primary);
            line-height: 1.5;
        }

        .question-meta {
            display: flex;
            flex-wrap: wrap;
            gap: 0.5rem;
            align-items: center;
        }

        .meta-badge {
            font-size: 0.7rem;
            padding: 0.2rem 0.5rem;
            border-radius: 4px;
            font-weight: 500;
            white-space: nowrap;
        }

        .badge-high {
            background: rgba(239, 68, 68, 0.15);
            color: #fca5a5;
            border: 1px solid rgba(239, 68, 68, 0.3);
        }

        .badge-medium {
            background: rgba(251, 191, 36, 0.15);
            color: #fcd34d;
            border: 1px solid rgba(251, 191, 36, 0.3);
        }

        .badge-low {
            background: rgba(34, 197, 94, 0.15);
            color: #86efac;
            border: 1px solid rgba(34, 197, 94, 0.3);
        }

        .badge-year {
            background: rgba(139, 92, 246, 0.15);
            color: #c4b5fd;
            border: 1px solid rgba(139, 92, 246, 0.3);
        }

        .badge-marks {
            background: rgba(56, 189, 248, 0.15);
            color: #7dd3fc;
            border: 1px solid rgba(56, 189, 248, 0.3);
        }

        .badge-frequency {
            background: rgba(236, 72, 153, 0.15);
            color: #f9a8d4;
            border: 1px solid rgba(236, 72, 153, 0.3);
        }

        .badge-priority-high {
            background: linear-gradient(135deg, rgba(239, 68, 68, 0.2), rgba(220, 38, 38, 0.2));
            color: #fca5a5;
            border: 1px solid rgba(239, 68, 68, 0.4);
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .years-inline {
            display: inline;
            font-size: inherit;
            color: #1a1a2e;
            padding: 0 2px;
            border-radius: 2px;
        }

        @media (max-width: 1024px) {
            .header {
                padding: 1rem;
                flex-wrap: wrap;
                gap: 1rem;
            }

            .header-left {
                width: 100%;
            }

            .header-progress {
                width: 100%;
                max-width: 100%;
                order: 3;
            }

            .header-stats {
                width: 100%;
                justify-content: space-around;
            }
        }

        @media (max-width: 768px) {
            .header {
                padding: 0.875rem;
            }

            .header-title {
                font-size: 1rem;
            }

            .header-subtitle {
                font-size: 0.75rem;
            }

            .header-stats {
                gap: 0.75rem;
            }

            .stat-value {
                font-size: 1.125rem;
            }

            .stat-label {
                font-size: 0.625rem;
            }

            .main-layout {
                flex-direction: column;
            }

            .sidebar {
                width: 100%;
                border-right: none;
                border-bottom: 1px solid var(--glass-border);
                padding: 1rem;
                max-height: none;
            }

            .sidebar-section {
                margin-bottom: 1rem;
            }

            .content-area {
                padding: 1rem;
            }

            .unit-header {
                padding: 0.875rem;
            }

            .unit-title {
                font-size: 0.875rem;
                gap: 0.5rem;
            }

            .unit-info {
                font-size: 0.75rem;
            }

            .subtopic-header {
                padding: 0.75rem 0.875rem;
            }

            .subtopic-title {
                font-size: 0.8125rem;
                gap: 0.5rem;
            }

            .subtopic-stats {
                font-size: 0.75rem;
            }

            .unit-checkbox, .subtopic-checkbox {
                width: 16px;
                height: 16px;
            }

            .question-item {
                padding: 0.65rem;
            }

            .question-header {
                flex-direction: column;
                align-items: flex-start;
                gap: 0.6rem;
            }

            .question-left {
                gap: 0.4rem;
                width: 100%;
                max-width: 100%;
                align-items: flex-start;
            }

            .question-right {
                width: 100%;
                max-width: 100%;
                justify-content: flex-start;
            }

            .question-checkbox {
                width: 16px;
                height: 16px;
            }

            .question-id {
                font-size: 0.75rem;
                min-width: auto;
            }

            .question-text {
                font-size: 0.8125rem;
            }

            .question-meta {
                gap: 0.375rem;
            }

            .meta-badge {
                font-size: 0.68rem;
                padding: 0.18rem 0.4rem;
            }
        }
    </style>
</head>
<body>
    <div class="header">
        <div class="header-left">
            <div class="header-title">Database Management Systems</div>
            <div class="header-subtitle">75 PYQ Questions • 2020-2024</div>
        </div>
        <div class="header-progress">
            <div class="header-progress-bar">
                <div class="header-progress-fill" id="headerProgressFill" style="width: 0%"></div>
            </div>
            <div class="header-progress-text" id="headerProgressText">0 of 75 completed</div>
        </div>
        <div class="header-stats">
            <div class="stat-box">
                <div class="stat-value" id="totalQuestions">75</div>
                <div class="stat-label">Total</div>
            </div>
            <div class="stat-box">
                <div class="stat-value" id="completedQuestions">0</div>
                <div class="stat-label">Done</div>
            </div>
            <div class="stat-box">
                <div class="stat-value" id="progressPercent">0%</div>
                <div class="stat-label">Progress</div>
            </div>
        </div>
    </div>

    <div class="main-layout">
        <div class="sidebar">
            <div class="sidebar-section">
                <div class="sidebar-title">Search</div>
                <div class="control-group">
                    <input type="text" id="searchBox" placeholder="Search questions...">
                </div>
            </div>

            <div class="sidebar-section">
                <div class="sidebar-title">Filters</div>
                <div class="control-group">
                    <label class="control-label">Unit</label>
                    <select id="unitFilter">
                        <option value="all">All Units</option>
                        <option value="Unit I">Unit I</option>
                        <option value="Unit II">Unit II</option>
                        <option value="Unit III">Unit III</option>
                        <option value="Unit IV">Unit IV</option>
                        <option value="Unit V">Unit V</option>
                    </select>
                </div>
                <div class="control-group">
                    <label class="control-label">Priority</label>
                    <select id="priorityFilter">
                        <option value="all">All Priorities</option>
                        <option value="high">High Priority</option>
                        <option value="medium">Medium Priority</option>
                        <option value="low">Low Priority</option>
                    </select>
                </div>
                <div class="control-group">
                    <label class="control-label">Year</label>
                    <select id="yearFilter">
                        <option value="all">All Years</option>
                        <option value="2024">2024</option>
                        <option value="2023">2023</option>
                        <option value="2022">2022</option>
                        <option value="2021">2021</option>
                        <option value="2020">2020</option>
                    </select>
                </div>
            </div>

            <div class="sidebar-section">
                <div class="sidebar-title">Actions</div>
                <button id="expandAll">Expand All</button>
                <button id="collapseAll">Collapse All</button>
                <button id="resetProgress">Reset Progress</button>
            </div>
        </div>

        <div class="content-area">
            <div class="container" id="questionBank"></div>
        </div>
    </div>

    <script>
        // Complete question database
        const questionDatabase = {
            "Unit I": {
                name: "UNIT I: INTRODUCTION TO DBMS AND ER MODEL",
                subtopics: {
                    "1.1": {
                        name: "Introduction to DBMS",
                        priority: "high",
                        questions: [
                            {id: "Q1.1.1", text: "What is a Database Management System? Explain its advantages over file systems.", meta: {frequency: 5, marks: 8, years: ["2020", "2021", "2022", "2023", "2024"], priority: "high"}},
                            {id: "Q1.1.2", text: "Define Database System. Discuss the characteristics of database approach.", meta: {year: "2023", marks: 6}},
                            {id: "Q1.1.3", text: "Explain the three-level architecture of DBMS with neat diagram.", meta: {frequency: 4, marks: 8, years: ["2020", "2021", "2023", "2024"], priority: "high"}},
                            {id: "Q1.1.4", text: "What are the responsibilities of Database Administrator (DBA)?", meta: {year: "2022", marks: 4}}
                        ]
                    },
                    "1.2": {
                        name: "Data Models",
                        priority: "medium",
                        questions: [
                            {id: "Q1.2.1", text: "Compare and contrast different data models: Hierarchical, Network, Relational, and Object-Oriented.", meta: {frequency: 3, marks: 8, years: ["2020", "2022", "2024"]}},
                            {id: "Q1.2.2", text: "Explain the concept of data abstraction and data independence in DBMS.", meta: {year: "2021", marks: 6}},
                            {id: "Q1.2.3", text: "What is the difference between logical and physical data independence?", meta: {year: "2023", marks: 4}}
                        ]
                    },
                    "1.3": {
                        name: "Entity-Relationship Model",
                        priority: "high",
                        questions: [
                            {id: "Q1.3.1", text: "Define Entity, Attribute, and Relationship. Explain with examples from a real-world scenario.", meta: {frequency: 4, marks: 8, years: ["2020", "2021", "2022", "2024"], priority: "high"}},
                            {id: "Q1.3.2", text: "Draw an ER diagram for a Library Management System showing entities, attributes, and relationships.", meta: {year: "2023", marks: 10}},
                            {id: "Q1.3.3", text: "What are weak entities? Explain with an example and show in ER diagram.", meta: {frequency: 3, marks: 6, years: ["2021", "2022", "2024"]}},
                            {id: "Q1.3.4", text: "Explain different types of attributes: Simple, Composite, Single-valued, Multi-valued, Derived.", meta: {year: "2020", marks: 6}}

                    },
                    "1.4": {
                        name: "Cardinality and Participation",
                        priority: "high",
                        questions: [
                            {id: "Q1.4.1", text: "Explain cardinality ratios: one-to-one, one-to-many, and many-to-many with examples.", meta: {frequency: 5, marks: 8, years: ["2020", "2021", "2022", "2023", "2024"], priority: "high"}},
                            {id: "Q1.4.2", text: "What is the difference between total and partial participation? Illustrate with ER diagram.", meta: {year: "2022", marks: 6}},

                }
            },
            "Unit II": {
                name: "UNIT II: RELATIONAL MODEL AND SQL",
                subtopics: {
                    "2.1": {
                        name: "Relational Model Concepts",
                        priority: "high",
                        questions: [
                            {id: "Q2.1.1", text: "Define the Relational Model. Explain the structure of relational databases with examples.", meta: {frequency: 4, marks: 8, years: ["2020", "2021", "2023", "2024"], priority: "high"}},
                            {id: "Q2.1.2", text: "What are domains, tuples, attributes, and relations in the relational model?", meta: {year: "2022", marks: 6}},
                            {id: "Q2.1.3", text: "Explain the concept of keys: Super key, Candidate key, Primary key, Foreign key, Alternate key.", meta: {frequency: 5, marks: 8, years: ["2020", "2021", "2022", "2023", "2024"], priority: "high"}},
                            {id: "Q2.1.4", text: "What is referential integrity constraint? Explain with example.", meta: {year: "2021", marks: 4}}
                        ]
                    },
                    "2.2": {
                        name: "Relational Algebra",
                        priority: "high",
                        questions: [
                            {id: "Q2.2.1", text: "Explain all relational algebra operations with examples: Select, Project, Union, Set Difference, Cartesian Product, Join.", meta: {frequency: 6, marks: 10, years: ["2020", "2021", "2022", "2023", "2024"], priority: "high"}},
                            {id: "Q2.2.2", text: "What are the different types of joins in relational algebra? Explain with examples.", meta: {frequency: 4, marks: 8, years: ["2020", "2022", "2023", "2024"]}},
                            {id: "Q2.2.3", text: "Write relational algebra expressions for: (a) Find all students enrolled in 'DBMS' course (b) Find courses with more than 50 students.", meta: {year: "2021", marks: 6}}

                    "2.3": {
                        name: "SQL Basics",
                        priority: "high",
                        questions: [
                            {id: "Q2.3.1", text: "Explain DDL, DML, DCL, and TCL commands in SQL with examples for each category.", meta: {frequency: 5, marks: 8, years: ["2020", "2021", "2022", "2023", "2024"], priority: "high"}},
                            {id: "Q2.3.2", text: "Write SQL queries to create a Student database with tables: Student(sid, name, age, dept), Course(cid, cname, credits), Enrollment(sid, cid, grade).", meta: {year: "2023", marks: 10}},
                            {id: "Q2.3.3", text: "What are constraints in SQL? Explain PRIMARY KEY, FOREIGN KEY, UNIQUE, NOT NULL, CHECK, DEFAULT.", meta: {frequency: 3, marks: 6, years: ["2021", "2022", "2024"]}}

                    },
                    "2.4": {
                        name: "Advanced SQL",

                        questions: [

            "Unit III": {
                name: "UNIT III: NORMALIZATION",
                subtopics: {

                        name: "Functional Dependencies",

                        questions: [
                            {id: "Q3.1.1", text: "What is Functional Dependency? Explain with examples from a real database schema.", meta: {frequency: 5, marks: 8, years: ["2020", "2021", "2022", "2023", "2024"], priority: "high"}},
                            {id: "Q3.1.2", text: "Explain Armstrong's Axioms for functional dependencies: Reflexivity, Augmentation, Transitivity.", meta: {frequency: 4, marks: 6, years: ["2020", "2021", "2023", "2024"]}},
                            {id: "Q3.1.3", text: "What is closure of functional dependencies? How do you compute attribute closure?", meta: {year: "2022", marks: 6}},
                            {id: "Q3.1.4", text: "Define trivial and non-trivial functional dependencies with examples.", meta: {year: "2021", marks: 4}}
                        ]
                    },
                    "3.2": {
                        name: "Normal Forms",
                        priority: "high",
                        questions: [
                            {id: "Q3.2.1", text: "Explain the concept of normalization. Why is it needed in database design?", meta: {frequency: 4, marks: 6, years: ["2020", "2022", "2023", "2024"]}},
                            {id: "Q3.2.2", text: "Define First Normal Form (1NF) with examples. Convert an unnormalized relation to 1NF.", meta: {frequency: 5, marks: 8, years: ["2020", "2021", "2022", "2023", "2024"], priority: "high"}},
                            {id: "Q3.2.3", text: "Explain Second Normal Form (2NF). What is partial dependency? Show conversion from 1NF to 2NF.", meta: {frequency: 5, marks: 8, years: ["2020", "2021", "2022", "2023", "2024"], priority: "high"}},
                            {id: "Q3.2.4", text: "What is Third Normal Form (3NF)? Explain transitive dependency with examples.", meta: {frequency: 5, marks: 8, years: ["2020", "2021", "2022", "2023", "2024"], priority: "high"}},
                            {id: "Q3.2.5", text: "Define Boyce-Codd Normal Form (BCNF). How is it different from 3NF?", meta: {frequency: 4, marks: 8, years: ["2021", "2022", "2023", "2024"]}},
                            {id: "Q3.2.6", text: "Explain Fourth Normal Form (4NF) and Multi-valued dependencies.", meta: {year: "2020", marks: 6}}
                        ]
                    },
                    "3.3": {
                        name: "Decomposition",
                        priority: "medium",
                        questions: [
                            {id: "Q3.3.1", text: "What is lossless join decomposition? Why is it important?", meta: {frequency: 3, marks: 6, years: ["2021", "2022", "2024"]}},
                            {id: "Q3.3.2", text: "Explain dependency preservation in decomposition with examples.", meta: {year: "2023", marks: 6}},
                            {id: "Q3.3.3", text: "Given a relation and functional dependencies, decompose it into BCNF ensuring lossless join.", meta: {year: "2020", marks: 10}},
                            {id: "Q3.3.4", text: "What is the difference between lossy and lossless decomposition? Illustrate with examples.", meta: {year: "2022", marks: 6}}
                        ]
                    },
                    "3.4": {
                        name: "Denormalization",
                        priority: "low",
                        questions: [
                            {id: "Q3.4.1", text: "What is denormalization? When and why would you denormalize a database?", meta: {year: "2024", marks: 4}},
                            {id: "Q3.4.2", text: "Discuss the trade-offs between normalization and denormalization.", meta: {year: "2023", marks: 4}}
                        ]
                    }
                }
            },
            "Unit IV": {
                name: "UNIT IV: TRANSACTIONS AND CONCURRENCY CONTROL",
                subtopics: {
                    "4.1": {
                        name: "Transaction Concepts",
                        priority: "high",
                        questions: [
                            {id: "Q4.1.1", text: "What is a transaction? Explain the ACID properties with examples for each property.", meta: {frequency: 6, marks: 10, years: ["2020", "2021", "2022", "2023", "2024"], priority: "high"}},
                            {id: "Q4.1.2", text: "Define transaction states: Active, Partially Committed, Committed, Failed, Aborted. Draw state diagram.", meta: {frequency: 4, marks: 8, years: ["2020", "2021", "2023", "2024"]}},
                            {id: "Q4.1.3", text: "Explain the concept of serializability in database transactions.", meta: {year: "2022", marks: 6}}
                        ]
                    },
                    "4.2": {
                        name: "Concurrency Control",
                        priority: "high",
                        questions: [
                            {id: "Q4.2.1", text: "Why is concurrency control needed in database systems? Explain the problems of concurrent execution.", meta: {frequency: 4, marks: 8, years: ["2020", "2021", "2023", "2024"]}},
                            {id: "Q4.2.2", text: "What are the anomalies in concurrent transactions: Dirty Read, Lost Update, Unrepeatable Read, Phantom Read?", meta: {frequency: 5, marks: 8, years: ["2020", "2021", "2022", "2023", "2024"], priority: "high"}},
                            {id: "Q4.2.3", text: "Explain conflict serializability and view serializability with examples.", meta: {year: "2022", marks: 8}}
                        ]
                    },
                    "4.3": {
                        name: "Locking Protocols",
                        priority: "high",
                        questions: [
                            {id: "Q4.3.1", text: "Explain Two-Phase Locking (2PL) protocol. What are its phases? Draw a timeline diagram.", meta: {frequency: 5, marks: 10, years: ["2020", "2021", "2022", "2023", "2024"], priority: "high"}},
                            {id: "Q4.3.2", text: "What is the difference between shared lock and exclusive lock? Explain with examples.", meta: {year: "2021", marks: 4}},
                            {id: "Q4.3.3", text: "Explain Strict Two-Phase Locking and Rigorous Two-Phase Locking protocols.", meta: {year: "2023", marks: 6}},
                            {id: "Q4.3.4", text: "What is deadlock in database systems? Explain deadlock detection and prevention techniques.", meta: {frequency: 4, marks: 8, years: ["2020", "2022", "2023", "2024"]}}
                        ]
                    },
                    "4.4": {
                        name: "Timestamp and Recovery",
                        priority: "medium",
                        questions: [
                            {id: "Q4.4.1", text: "Explain timestamp-based concurrency control protocol with example.", meta: {year: "2024", marks: 6}},
                            {id: "Q4.4.2", text: "What is a log in database recovery? Explain write-ahead logging (WAL).", meta: {frequency: 3, marks: 6, years: ["2021", "2022", "2024"]}},
                            {id: "Q4.4.3", text: "Explain checkpoint mechanism in database recovery.", meta: {year: "2020", marks: 4}},
                            {id: "Q4.4.4", text: "Discuss different recovery techniques: Immediate Update, Deferred Update, Shadow Paging.", meta: {year: "2023", marks: 8}}
                        ]
                    }
                }
            },
            "Unit V": {
                name: "UNIT V: QUERY PROCESSING AND OPTIMIZATION",
                subtopics: {
                    "5.1": {
                        name: "Query Processing",
                        priority: "high",
                        questions: [
                            {id: "Q5.1.1", text: "Explain the steps involved in query processing: Parsing, Translation, Optimization, Execution.", meta: {frequency: 5, marks: 8, years: ["2020", "2021", "2022", "2023", "2024"], priority: "high"}},
                            {id: "Q5.1.2", text: "What is a query execution plan? How does the DBMS choose an optimal plan?", meta: {year: "2023", marks: 6}},
                            {id: "Q5.1.3", text: "Explain the cost-based query optimization approach.", meta: {year: "2021", marks: 6}}
                        ]
                    },
                    "5.2": {
                        name: "Indexing",
                        priority: "high",
                        questions: [
                            {id: "Q5.2.1", text: "What is indexing in databases? Explain different types of indexes: Primary, Secondary, Clustered, Non-clustered.", meta: {frequency: 5, marks: 10, years: ["2020", "2021", "2022", "2023", "2024"], priority: "high"}},
                            {id: "Q5.2.2", text: "Explain B-Tree and B+ Tree indexing structures with diagrams. Compare their characteristics.", meta: {frequency: 4, marks: 10, years: ["2020", "2021", "2023", "2024"]}},
                            {id: "Q5.2.3", text: "What is hashing? Explain static hashing and dynamic hashing techniques.", meta: {frequency: 3, marks: 8, years: ["2022", "2023", "2024"]}}
                        ]
                    },
                    "5.3": {
                        name: "Query Optimization",
                        priority: "medium",
                        questions: [
                            {id: "Q5.3.1", text: "Explain heuristic query optimization rules: selection pushdown, projection pushdown, join ordering.", meta: {year: "2024", marks: 6}},
                            {id: "Q5.3.2", text: "What are the factors affecting query performance? How can queries be optimized?", meta: {year: "2020", marks: 6}},
                            {id: "Q5.3.3", text: "Explain the role of statistics in query optimization.", meta: {year: "2022", marks: 4}}
                        ]
                    },
                    "5.4": {
                        name: "Advanced Topics",
                        priority: "low",
                        questions: [
                            {id: "Q5.4.1", text: "What is data warehousing? Explain OLAP vs OLTP systems.", meta: {year: "2023", marks: 6}},
                            {id: "Q5.4.2", text: "Explain the concept of NoSQL databases. Compare SQL and NoSQL databases.", meta: {year: "2024", marks: 6}},
                            {id: "Q5.4.3", text: "What is database security? Explain access control mechanisms in DBMS.", meta: {year: "2021", marks: 4}}
                        ]
                    }
                }
            }
        };

        // Progress tracking
        let progressData = loadProgress();

        function loadProgress() {
            const saved = localStorage.getItem('dbms_question_progress');
            return saved ? JSON.parse(saved) : {};
        }

        function saveProgress(data) {
            localStorage.setItem('dbms_question_progress', JSON.stringify(data));
        }

        // Render the question bank
        function renderQuestionBank() {
            const container = document.getElementById('questionBank');
            container.innerHTML = '';

            Object.keys(questionDatabase).forEach(unitKey => {
                const unitData = questionDatabase[unitKey];
                const unitSection = document.createElement('div');
                unitSection.className = 'unit-section';

                const unitHeader = document.createElement('div');
                unitHeader.className = 'unit-header';

                const unitTitle = document.createElement('div');
                unitTitle.className = 'unit-title';

                const unitCheckbox = document.createElement('input');
                unitCheckbox.type = 'checkbox';
                unitCheckbox.className = 'unit-checkbox';
                unitCheckbox.addEventListener('change', (e) => toggleUnit(unitKey, e.target.checked));

                const unitTitleText = document.createElement('span');
                unitTitleText.textContent = unitData.name;

                unitTitle.appendChild(unitCheckbox);
                unitTitle.appendChild(unitTitleText);

                const unitInfo = document.createElement('div');
                unitInfo.className = 'unit-info';
                const questionCount = Object.values(unitData.subtopics).reduce((sum, sub) => sum + sub.questions.length, 0);
                unitInfo.textContent = `${questionCount} questions`;

                const dropdownIcon = document.createElement('span');
                dropdownIcon.className = 'dropdown-icon';
                dropdownIcon.textContent = '▼';

                unitHeader.appendChild(unitTitle);
                unitHeader.appendChild(unitInfo);
                unitHeader.appendChild(dropdownIcon);

                unitHeader.addEventListener('click', (e) => {
                    if (e.target !== unitCheckbox) {
                        unitHeader.classList.toggle('active');
                        unitContent.classList.toggle('show');
                    }
                });

                const unitContent = document.createElement('div');
                unitContent.className = 'unit-content';

                Object.keys(unitData.subtopics).forEach(subtopicKey => {
                    const subtopicData = unitData.subtopics[subtopicKey];
                    const subtopicSection = document.createElement('div');
                    subtopicSection.className = 'subtopic-section';

                    const subtopicHeader = document.createElement('div');
                    subtopicHeader.className = 'subtopic-header';

                    const subtopicTitle = document.createElement('div');
                    subtopicTitle.className = 'subtopic-title';

                    const subtopicCheckbox = document.createElement('input');
                    subtopicCheckbox.type = 'checkbox';
                    subtopicCheckbox.className = 'subtopic-checkbox';
                    subtopicCheckbox.addEventListener('change', (e) => toggleSubtopic(unitKey, subtopicKey, e.target.checked));

                    const subtopicTitleText = document.createElement('span');
                    subtopicTitleText.textContent = `${subtopicKey} ${subtopicData.name}`;

                    subtopicTitle.appendChild(subtopicCheckbox);
                    subtopicTitle.appendChild(subtopicTitleText);

                    const subtopicStats = document.createElement('div');
                    subtopicStats.className = 'subtopic-stats';
                    subtopicStats.textContent = `${subtopicData.questions.length} Q`;

                    subtopicHeader.appendChild(subtopicTitle);
                    subtopicHeader.appendChild(subtopicStats);

                    subtopicHeader.addEventListener('click', (e) => {
                        if (e.target !== subtopicCheckbox) {
                            subtopicHeader.classList.toggle('active');
                            subtopicContent.classList.toggle('show');
                        }
                    });

                    const subtopicContent = document.createElement('div');
                    subtopicContent.className = 'subtopic-content';

                    subtopicData.questions.forEach(question => {
                        const questionItem = createQuestionElement(question, unitKey, subtopicKey);
                        subtopicContent.appendChild(questionItem);
                    });

                    subtopicSection.appendChild(subtopicHeader);
                    subtopicSection.appendChild(subtopicContent);
                    unitContent.appendChild(subtopicSection);
                });

                unitSection.appendChild(unitHeader);
                unitSection.appendChild(unitContent);
                container.appendChild(unitSection);
            });

            updateStats();
            updateUnitCheckboxes();
        }

        function toggleUnit(unitKey, checked) {
            const unitData = questionDatabase[unitKey];
            Object.keys(unitData.subtopics).forEach(subtopicKey => {
                unitData.subtopics[subtopicKey].questions.forEach(question => {
                    progressData[question.id] = checked;
                });
            });
            saveProgress(progressData);
            renderQuestionBank();
        }

        function toggleSubtopic(unitKey, subtopicKey, checked) {
            const subtopicData = questionDatabase[unitKey].subtopics[subtopicKey];
            subtopicData.questions.forEach(question => {
                progressData[question.id] = checked;
            });
            saveProgress(progressData);
            renderQuestionBank();
        }

        function toggleQuestion(questionId, checked) {
            progressData[questionId] = checked;
            saveProgress(progressData);
            updateStats();
            updateUnitCheckboxes();
        }

        function updateUnitCheckboxes() {
            document.querySelectorAll('.unit-section').forEach((unitSection, unitIdx) => {
                const unitKey = Object.keys(questionDatabase)[unitIdx];
                const unitData = questionDatabase[unitKey];
                const unitCheckbox = unitSection.querySelector('.unit-checkbox');
                
                let allChecked = true;
                let someChecked = false;
                
                Object.values(unitData.subtopics).forEach(subtopicData => {
                    subtopicData.questions.forEach(question => {
                        if (progressData[question.id]) {
                            someChecked = true;
                        } else {
                            allChecked = false;
                        }
                    });
                });

                unitCheckbox.checked = allChecked;
                unitCheckbox.indeterminate = someChecked && !allChecked;

                // Update subtopic checkboxes
                unitSection.querySelectorAll('.subtopic-section').forEach((subtopicSection, subtopicIdx) => {
                    const subtopicKey = Object.keys(unitData.subtopics)[subtopicIdx];
                    const subtopicData = unitData.subtopics[subtopicKey];
                    const subtopicCheckbox = subtopicSection.querySelector('.subtopic-checkbox');
                    
                    let allSubChecked = true;
                    let someSubChecked = false;
                    
                    subtopicData.questions.forEach(question => {
                        if (progressData[question.id]) {
                            someSubChecked = true;
                        } else {
                            allSubChecked = false;
                        }
                    });

                    subtopicCheckbox.checked = allSubChecked;
                    subtopicCheckbox.indeterminate = someSubChecked && !allSubChecked;
                });
            });
        }

        function createQuestionElement(question, unitKey, subtopicKey) {
            const item = document.createElement('div');
            item.className = 'question-item';
            
            const isChecked = progressData[question.id] || false;
            if (isChecked) {
                item.classList.add('checked');
            }

            const header = document.createElement('div');
            header.className = 'question-header';

            const leftSection = document.createElement('div');
            leftSection.className = 'question-left';

            const checkbox = document.createElement('input');
            checkbox.type = 'checkbox';
            checkbox.className = 'question-checkbox';
            checkbox.checked = isChecked;
            checkbox.addEventListener('change', (e) => {
                toggleQuestion(question.id, e.target.checked);
                if (e.target.checked) {
                    item.classList.add('checked');
                } else {
                    item.classList.remove('checked');
                }
            });

            const questionId = document.createElement('span');
            questionId.className = 'question-id';
            questionId.textContent = question.id;

            const questionText = document.createElement('span');
            questionText.className = 'question-text';
            questionText.textContent = question.text;

            leftSection.appendChild(checkbox);
            leftSection.appendChild(questionId);
            leftSection.appendChild(questionText);

            const rightSection = document.createElement('div');
            rightSection.className = 'question-right';

            const meta = document.createElement('div');
            meta.className = 'question-meta';

            if (question.meta.priority) {
                if (question.meta.priority === 'high' || question.meta.priority === 'highest') {
                    meta.innerHTML += `<span class="meta-badge badge-high">⚠️ HIGH PRIORITY</span>`;
                }
            }
            if (question.meta.frequency) {
                meta.innerHTML += `<span class="meta-badge badge-frequency">Asked ${question.meta.frequency}x</span>`;
            }
            if (question.meta.year) {
                meta.innerHTML += `<span class="meta-badge badge-year">📅 ${question.meta.year}</span>`;
            }
            if (question.meta.years) {
                question.meta.years.forEach(year => {
                    meta.innerHTML += `<span class="meta-badge badge-year">📅 ${year}</span>`;
                });
            }
            if (question.meta.marks) {
                meta.innerHTML += `<span class="meta-badge badge-marks">${question.meta.marks} marks</span>`;
            }

            rightSection.appendChild(meta);
            header.appendChild(leftSection);
            header.appendChild(rightSection);
            item.appendChild(header);
            return item;
        }

        function updateStats() {
            const totalQuestions = getTotalQuestions();
            const completedQuestions = Object.values(progressData).filter(v => v === true).length;
            const percent = totalQuestions > 0 ? Math.round((completedQuestions / totalQuestions) * 100) : 0;

            // Update header stats
            document.getElementById('totalQuestions').textContent = totalQuestions;
            document.getElementById('completedQuestions').textContent = completedQuestions;
            document.getElementById('progressPercent').textContent = percent + '%';

            // Update header progress bar and text
            document.getElementById('headerProgressFill').style.width = percent + '%';
            document.getElementById('headerProgressText').textContent = `${completedQuestions} of ${totalQuestions} completed`;
        }

        function getTotalQuestions() {
            let total = 0;
            Object.values(questionDatabase).forEach(unitData => {
                Object.values(unitData.subtopics).forEach(subtopicData => {
                    total += subtopicData.questions.length;
                });
            });
            return total;
        }

        // Control buttons
        document.getElementById('expandAll').addEventListener('click', () => {
            document.querySelectorAll('.unit-header').forEach(h => {
                h.classList.add('active');
                h.nextElementSibling.classList.add('show');
            });
            document.querySelectorAll('.subtopic-header').forEach(h => {
                h.classList.add('active');
                h.nextElementSibling.classList.add('show');
            });
        });

        document.getElementById('collapseAll').addEventListener('click', () => {
            document.querySelectorAll('.unit-header').forEach(h => {
                h.classList.remove('active');
                h.nextElementSibling.classList.remove('show');
            });
            document.querySelectorAll('.subtopic-header').forEach(h => {
                h.classList.remove('active');
                h.nextElementSibling.classList.remove('show');
            });
        });

        document.getElementById('resetProgress').addEventListener('click', () => {
            if (confirm('Are you sure you want to reset all progress? This cannot be undone.')) {
                progressData = {};
                saveProgress(progressData);
                renderQuestionBank();
            }
        });

        // Search and filters
        document.getElementById('searchBox').addEventListener('input', applyFilters);
        document.getElementById('unitFilter').addEventListener('change', applyFilters);
        document.getElementById('priorityFilter').addEventListener('change', applyFilters);
        document.getElementById('yearFilter').addEventListener('change', applyFilters);

        function applyFilters() {
            const search = document.getElementById('searchBox').value.toLowerCase();
            const unitFilter = document.getElementById('unitFilter').value;
            const priorityFilter = document.getElementById('priorityFilter').value;
            const yearFilter = document.getElementById('yearFilter').value;

            document.querySelectorAll('.unit-section').forEach((unitSection, idx) => {
                const unitKey = Object.keys(questionDatabase)[idx];
                const showUnit = unitFilter === 'all' || unitFilter === unitKey;

                let unitHasResults = false;

                unitSection.querySelectorAll('.subtopic-section').forEach(subtopicSection => {
                    let subtopicHasResults = false;

                    subtopicSection.querySelectorAll('.question-item').forEach(questionItem => {
                        const text = questionItem.textContent.toLowerCase();
                        const matchesSearch = search === '' || text.includes(search);

                        let matchesPriority = true;
                        const hasMeta = questionItem.querySelector('.badge-high');
                        if (priorityFilter === 'high' && !hasMeta) matchesPriority = false;
                        
                        let matchesYear = true;
                        if (yearFilter !== 'all') {
                            matchesYear = text.includes(yearFilter);
                        }
                        
                        if (matchesSearch && matchesPriority && matchesYear && showUnit) {
                            questionItem.style.display = 'block';
                            subtopicHasResults = true;
                            unitHasResults = true;
                        } else {
                            questionItem.style.display = 'none';
                        }
                    });

                    subtopicSection.style.display = subtopicHasResults ? 'block' : 'none';
                });

                unitSection.style.display = unitHasResults ? 'block' : 'none';
            });

            // Auto-expand if filtering
            if (search !== '' || unitFilter !== 'all' || priorityFilter !== 'all' || yearFilter !== 'all') {
                document.querySelectorAll('.unit-header').forEach(h => {
                    if (h.parentElement.style.display !== 'none') {
                        h.classList.add('active');
                        h.nextElementSibling.classList.add('show');
                    }
                });
                document.querySelectorAll('.subtopic-header').forEach(h => {
                    if (h.parentElement.style.display !== 'none') {
                        h.classList.add('active');
                        h.nextElementSibling.classList.add('show');
                    }
                });
            }
        }

        // Initialize
        renderQuestionBank();
        
        // Auto-expand first unit on load
        setTimeout(() => {
            const firstUnit = document.querySelector('.unit-header');
            if (firstUnit) {
                firstUnit.classList.add('active');
                firstUnit.nextElementSibling.classList.add('show');
            }
        }, 100);
    </script>
