<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Question Evaluation Interface | Data Structures</title>
    <style>
        :root {
            --glass-bg: rgba(255, 255, 255, 0.06);
            --glass-bg-hover: rgba(255, 255, 255, 0.1);
            --glass-border: rgba(255, 255, 255, 0.12);
            --glass-border-hover: rgba(255, 255, 255, 0.22);
            --glass-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
            --accent: #38bdf8;
            --accent-dim: rgba(56, 189, 248, 0.7);
            --accent-glow: rgba(56, 189, 248, 0.25);
            --text-primary: rgba(255, 255, 255, 0.95);
            --text-secondary: rgba(255, 255, 255, 0.55);
            --text-muted: rgba(255, 255, 255, 0.35);
            --transition: all 0.3s ease;
            --blur: blur(14px);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #0f0c29 0%, #1a1a2e 40%, #16213e 70%, #0f3460 100%);
            background-attachment: fixed;
            min-height: 100vh;
            color: var(--text-primary);
            line-height: 1.6;
            display: flex;
            flex-direction: column;
        }

        .header {
            background: rgba(15, 12, 41, 0.75);
            color: var(--text-primary);
            padding: 1rem 2rem;
            border-bottom: 1px solid var(--glass-border);
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 2rem;
            backdrop-filter: var(--blur);
            -webkit-backdrop-filter: var(--blur);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .header-left {
            flex-shrink: 0;
        }

        .header-title {
            font-size: 1.125rem;
            font-weight: 600;
            letter-spacing: -0.01em;
            color: var(--text-primary);
        }

        .header-subtitle {
            font-size: 0.8125rem;
            color: var(--text-secondary);
            font-weight: 400;
        }

        .header-progress {
            flex: 1;
            max-width: 400px;
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }

        .header-progress-bar {
            background: rgba(255, 255, 255, 0.1);
            height: 6px;
            border-radius: 3px;
            overflow: hidden;
        }

        .header-progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #38bdf8, #818cf8);
            transition: width 0.3s;
            border-radius: 3px;
        }

        .header-progress-text {
            font-size: 0.75rem;
            color: var(--text-secondary);
            text-align: center;
        }

        .header-stats {
            display: flex;
            gap: 2rem;
            align-items: center;
            flex-shrink: 0;
        }

        .stat-box {
            text-align: center;
        }

        .stat-value {
            font-size: 1.25rem;
            font-weight: 700;
            color: var(--accent);
            margin-bottom: 0.125rem;
        }

        .stat-label {
            font-size: 0.6875rem;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 0.05em;
            font-weight: 500;
        }

        .main-layout {
            display: flex;
            flex: 1;
            overflow: hidden;
        }

        .sidebar {
            width: 280px;
            background: rgba(15, 12, 41, 0.5);
            border-right: 1px solid var(--glass-border);
            padding: 1.5rem;
            overflow-y: auto;
            flex-shrink: 0;
            backdrop-filter: var(--blur);
            -webkit-backdrop-filter: var(--blur);
        }

        .sidebar-section {
            margin-bottom: 1.25rem;
        }

        .sidebar-title {
            font-size: 0.75rem;
            font-weight: 600;
            color: var(--accent-dim);
            text-transform: uppercase;
            letter-spacing: 0.08em;
            margin-bottom: 0.6rem;
        }

        .control-group {
            margin-bottom: 0.75rem;
        }

        .control-group:last-child {
            margin-bottom: 0;
        }

        .control-label {
            font-size: 0.8125rem;
            font-weight: 500;
            color: var(--text-secondary);
            display: block;
            margin-bottom: 0.5rem;
        }

        input[type="text"], select, button {
            width: 100%;
            padding: 0.5rem 0.75rem;
            border: 1px solid var(--glass-border);
            border-radius: 8px;
            font-size: 0.875rem;
            transition: var(--transition);
            background: var(--glass-bg);
            color: var(--text-primary);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
        }

        input[type="text"]::placeholder {
            color: var(--text-muted);
        }

        input[type="text"]:focus, select:focus {
            outline: none;
            border-color: var(--accent);
            background: var(--glass-bg-hover);
            box-shadow: 0 0 0 3px var(--accent-glow);
        }

        select {
            color: var(--text-primary);
        }

        select option {
            background: #1a1a2e;
            color: var(--text-primary);
        }

        button {
            background: rgba(56, 189, 248, 0.15);
            color: var(--text-primary);
            border: 1px solid rgba(56, 189, 248, 0.25);
            cursor: pointer;
            font-weight: 500;
            margin-bottom: 0.5rem;
        }

        button:hover {
            background: rgba(56, 189, 248, 0.25);
            border-color: rgba(56, 189, 248, 0.45);
            transform: translateY(-1px);
        }

        .content-area {
            flex: 1;
            overflow-y: auto;
            padding: 2rem;
        }

        .container {
            max-width: 1200px;
        }

        .unit-section {
            margin-bottom: 1.5rem;
            border: 1px solid var(--glass-border);
            border-radius: 16px;
            background: var(--glass-bg);
            backdrop-filter: var(--blur);
            -webkit-backdrop-filter: var(--blur);
            overflow: hidden;
            box-shadow: var(--glass-shadow);
            transition: var(--transition);
        }

        .unit-section:hover {
            border-color: var(--glass-border-hover);
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.4);
        }

        .unit-header {
            background: rgba(56, 189, 248, 0.06);
            padding: 1.25rem 1.5rem;
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: var(--transition);
            user-select: none;
            border-bottom: 1px solid var(--glass-border);
        }

        .unit-header:hover {
            background: rgba(56, 189, 248, 0.1);
        }

        .unit-header.active {
            background: rgba(56, 189, 248, 0.18);
            color: var(--text-primary);
            border-bottom-color: rgba(56, 189, 248, 0.25);
        }

        .unit-title {
            display: flex;
            align-items: center;
            gap: 1rem;
            font-weight: 600;
            font-size: 1rem;
            color: var(--text-primary);
        }

        .unit-checkbox {
            width: 18px;
            height: 18px;
            cursor: pointer;
            accent-color: var(--accent);
        }

        .unit-info {
            font-size: 0.875rem;
            opacity: 0.7;
            color: var(--text-secondary);
        }

        .dropdown-icon {
            font-size: 1.2rem;
            transition: transform 0.3s ease;
            color: var(--accent);
        }

        .unit-header.active .dropdown-icon {
            transform: rotate(180deg);
        }

        .unit-content {
            display: none;
            padding: 0;
            background: transparent;
        }

        .unit-content.show {
            display: block;
        }

        .subtopic-section {
            border-bottom: 1px solid rgba(255, 255, 255, 0.06);
        }

        .subtopic-section:last-child {
            border-bottom: none;
        }

        .subtopic-header {
            background: transparent;
            padding: 1rem 1.5rem;
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: var(--transition);
            user-select: none;
        }

        .subtopic-header:hover {
            background: rgba(255, 255, 255, 0.04);
        }

        .subtopic-header.active {
            background: rgba(56, 189, 248, 0.06);
        }

        .subtopic-title {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            font-weight: 500;
            font-size: 0.9375rem;
            color: var(--text-primary);
        }

        .subtopic-checkbox {
            width: 16px;
            height: 16px;
            cursor: pointer;
            accent-color: var(--accent);
        }

        .subtopic-stats {
            font-size: 0.8125rem;
            color: var(--text-secondary);
        }

        .subtopic-content {
            display: none;
            padding: 1rem 1.5rem 1.5rem;
            background: rgba(0, 0, 0, 0.15);
        }

        .subtopic-content.show {
            display: block;
        }

        .question-item {
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 10px;
            padding: 0.65rem 0.85rem;
            margin-bottom: 0.5rem;
            transition: var(--transition);
        }

        .question-item:hover {
            background: rgba(255, 255, 255, 0.07);
            border-color: rgba(255, 255, 255, 0.15);
            transform: translateY(-1px);
        }

        .question-item.completed {
            background: rgba(16, 185, 129, 0.1);
            border-color: rgba(16, 185, 129, 0.3);
        }

        .question-header {
            display: flex;
            gap: 0.6rem;
            align-items: flex-start;
            justify-content: space-between;
        }

        .question-left {
            display: flex;
            gap: 0.5rem;
            align-items: flex-start;
            flex: 1;
            min-width: 0;
            max-width: 65%;
        }

        .question-right {
            display: flex;
            gap: 0.35rem;
            align-items: center;
            flex-shrink: 0;
            flex-wrap: wrap;
            justify-content: flex-end;
            max-width: 33%;
        }

        .question-checkbox {
            width: 16px;
            height: 16px;
            cursor: pointer;
            flex-shrink: 0;
            margin-top: 3px;
            accent-color: var(--accent);
        }

        .question-id {
            font-weight: 600;
            color: var(--accent-dim);
            font-size: 0.8125rem;
            min-width: 58px;
            flex-shrink: 0;
            margin-top: 1px;
        }

        .question-text {
            flex: 1;
            line-height: 1.5;
            color: var(--text-primary);
            font-size: 0.9375rem;
            min-width: 0;
            word-wrap: break-word;
            overflow-wrap: break-word;
        }

        .question-meta {
            display: flex;
            flex-wrap: wrap;
            gap: 0.35rem;
            align-items: center;
        }

        .meta-badge {
            display: inline-block;
            padding: 0.2rem 0.45rem;
            background: rgba(255, 255, 255, 0.08);
            color: var(--text-secondary);
            border-radius: 5px;
            font-size: 0.7rem;
            font-weight: 500;
            white-space: nowrap;
            line-height: 1.3;
            border: 1px solid rgba(255, 255, 255, 0.08);
        }

        .badge-frequency {
            background: rgba(239, 68, 68, 0.15);
            color: #fca5a5;
            border-color: rgba(239, 68, 68, 0.25);
            font-weight: 600;
        }

        .badge-marks {
            background: rgba(16, 185, 129, 0.15);
            color: #6ee7b7;
            border-color: rgba(16, 185, 129, 0.25);
            font-weight: 600;
        }

        .badge-year {
            background: rgba(56, 189, 248, 0.12);
            color: var(--accent);
            border-color: rgba(56, 189, 248, 0.2);
        }

        .badge-high {
            background: rgba(129, 140, 248, 0.2);
            color: #a5b4fc;
            border-color: rgba(129, 140, 248, 0.3);
            font-weight: 600;
        }

        .no-results {
            text-align: center;
            padding: 4rem 2rem;
            color: var(--text-secondary);
        }

        .highlight {
            background: rgba(250, 204, 21, 0.5);
            color: #1a1a2e;
            padding: 0 2px;
            border-radius: 2px;
        }

        @media (max-width: 1024px) {
            .header {
                padding: 1rem;
                flex-wrap: wrap;
                gap: 1rem;
            }

            .header-left {
                width: 100%;
            }

            .header-progress {
                width: 100%;
                max-width: 100%;
                order: 3;
            }

            .header-stats {
                width: 100%;
                justify-content: space-around;
            }
        }

        @media (max-width: 768px) {
            .header {
                padding: 0.875rem;
            }

            .header-title {
                font-size: 1rem;
            }

            .header-subtitle {
                font-size: 0.75rem;
            }

            .header-stats {
                gap: 0.75rem;
            }

            .stat-value {
                font-size: 1.125rem;
            }

            .stat-label {
                font-size: 0.625rem;
            }

            .main-layout {
                flex-direction: column;
            }

            .sidebar {
                width: 100%;
                border-right: none;
                border-bottom: 1px solid var(--glass-border);
                padding: 1rem;
                max-height: none;
            }

            .sidebar-section {
                margin-bottom: 1rem;
            }

            .content-area {
                padding: 1rem;
            }

            .unit-header {
                padding: 0.875rem;
            }

            .unit-title {
                font-size: 0.875rem;
                gap: 0.5rem;
            }

            .unit-info {
                font-size: 0.75rem;
            }

            .subtopic-header {
                padding: 0.75rem 0.875rem;
            }

            .subtopic-title {
                font-size: 0.8125rem;
                gap: 0.5rem;
            }

            .subtopic-stats {
                font-size: 0.75rem;
            }

            .unit-checkbox, .subtopic-checkbox {
                width: 16px;
                height: 16px;
            }

            .question-item {
                padding: 0.65rem;
            }

            .question-header {
                flex-direction: column;
                align-items: flex-start;
                gap: 0.6rem;
            }

            .question-left {
                gap: 0.4rem;
                width: 100%;
                max-width: 100%;
                align-items: flex-start;
            }

            .question-right {
                width: 100%;
                max-width: 100%;
                justify-content: flex-start;
            }

            .question-checkbox {
                width: 16px;
                height: 16px;
            }

            .question-id {
                font-size: 0.75rem;
                min-width: auto;
            }

            .question-text {
                font-size: 0.8125rem;
            }

            .question-meta {
                gap: 0.375rem;
            }

            .meta-badge {
                font-size: 0.68rem;
                padding: 0.18rem 0.4rem;
            }
        }
    </style>
</head>
<body>
    <div class="header">
        <div class="header-left">
            <div class="header-title">Data Structures Question Bank</div>
            <div class="header-subtitle">80 PYQ Questions • 2020-2024</div>
        </div>
        <div class="header-progress">
            <div class="header-progress-bar">
                <div class="header-progress-fill" id="headerProgressFill" style="width: 0%"></div>
            </div>
            <div class="header-progress-text" id="headerProgressText">0 of 80 completed</div>
        </div>
        <div class="header-stats">
            <div class="stat-box">
                <div class="stat-value" id="totalQuestions">80</div>
                <div class="stat-label">Total</div>
            </div>
            <div class="stat-box">
                <div class="stat-value" id="completedQuestions">0</div>
                <div class="stat-label">Done</div>
            </div>
            <div class="stat-box">
                <div class="stat-value" id="progressPercent">0%</div>
                <div class="stat-label">Progress</div>
            </div>
        </div>
    </div>

    <div class="main-layout">
        <div class="sidebar">
            <div class="sidebar-section">
                <div class="sidebar-title">Search</div>
                <div class="control-group">
                    <input type="text" id="searchBox" placeholder="Search questions...">
                </div>
            </div>

            <div class="sidebar-section">
                <div class="sidebar-title">Filters</div>
                <div class="control-group">
                    <label class="control-label">Unit</label>
                    <select id="unitFilter">
                        <option value="all">All Units</option>
                        <option value="Unit I">Unit I</option>
                        <option value="Unit II">Unit II</option>
                        <option value="Unit III">Unit III</option>
                        <option value="Unit IV">Unit IV</option>
                        <option value="Unit V">Unit V</option>
                    </select>
                </div>
                <div class="control-group">
                    <label class="control-label">Priority</label>
                    <select id="priorityFilter">
                        <option value="all">All Priorities</option>
                        <option value="high">High Priority</option>
                        <option value="medium">Medium Priority</option>
                        <option value="low">Low Priority</option>
                    </select>
                </div>
                <div class="control-group">
                    <label class="control-label">Year</label>
                    <select id="yearFilter">
                        <option value="all">All Years</option>
                        <option value="2024">2024</option>
                        <option value="2023">2023</option>
                        <option value="2022">2022</option>
                        <option value="2021">2021</option>
                        <option value="2020">2020</option>
                    </select>
                </div>
            </div>

            <div class="sidebar-section">
                <div class="sidebar-title">Actions</div>
                <button id="expandAll">Expand All</button>
                <button id="collapseAll">Collapse All</button>
                <button id="resetProgress">Reset Progress</button>
            </div>
        </div>

        <div class="content-area">
            <div class="container" id="questionBank"></div>
        </div>
    </div>

    <script>
        // Complete question database for Data Structures
        const questionDatabase = {
            "Unit I": {
                name: "UNIT I: ARRAYS AND LINKED LISTS",
                subtopics: {
                    "1.1": {
                        name: "Arrays - Introduction and Operations",
                        priority: "high",
                        questions: [
                            {id: "Q1.1.1", text: "Define an array and explain its characteristics. What are the advantages and disadvantages of using arrays?", meta: {year: "2023(AM)", marks: 8}},
                            {id: "Q1.1.2", text: "Write an algorithm to insert an element at a given position in an array. What is the time complexity?", meta: {frequency: 5, marks: 6, years: ["2020(ND)", "2021(AM)", "2022(ND)", "2023(ND)", "2024(AM)"], priority: "highest"}},
                            {id: "Q1.1.3", text: "Explain the deletion operation in arrays with an example. Analyze its time complexity.", meta: {year: "2022(AM)", marks: 6}},
                            {id: "Q1.1.4", text: "What is a sparse matrix? Write a program to represent a sparse matrix using arrays.", meta: {year: "2021(ND)", marks: 8}}
                        ]
                    },
                    "1.2": {
                        name: "Multi-dimensional Arrays",
                        priority: "medium",
                        questions: [
                            {id: "Q1.2.1", text: "Explain row-major and column-major ordering in 2D arrays. Derive the address calculation formula for both.", meta: {frequency: 4, marks: 8, years: ["2020(AM)", "2021(ND)", "2023(AM)", "2024(ND)"], priority: "highest"}},
                            {id: "Q1.2.2", text: "Write a program to perform matrix multiplication using 2D arrays.", meta: {year: "2022(ND)", marks: 6}},
                            {id: "Q1.2.3", text: "How do you transpose a matrix? Write an algorithm and analyze its complexity.", meta: {year: "2024(AM)", marks: 6}}
                        ]
                    },
                    "1.3": {
                        name: "Linked Lists - Singly Linked List",
                        priority: "high",
                        questions: [
                            {id: "Q1.3.1", text: "What is a linked list? Explain the structure of a node in a singly linked list with diagram.", meta: {year: "2020(ND)", marks: 6}},
                            {id: "Q1.3.2", text: "Write algorithms to insert a node at the beginning, end, and middle of a singly linked list.", meta: {frequency: 6, marks: 10, years: ["2020(AM)", "2021(AM)", "2021(ND)", "2022(AM)", "2023(ND)", "2024(AM)"], priority: "highest"}},
                            {id: "Q1.3.3", text: "Explain the deletion operation in singly linked list for all cases (beginning, end, middle).", meta: {year: "2023(AM)", marks: 8}},
                            {id: "Q1.3.4", text: "Write a program to reverse a singly linked list. Explain with example.", meta: {frequency: 4, marks: 8, years: ["2021(AM)", "2022(ND)", "2023(ND)", "2024(ND)"], priority: "highest"}}
                        ]
                    },
                    "1.4": {
                        name: "Doubly and Circular Linked Lists",
                        priority: "high",
                        questions: [
                            {id: "Q1.4.1", text: "What is a doubly linked list? Explain its advantages over singly linked list with diagram.", meta: {year: "2022(AM)", marks: 6}},
                            {id: "Q1.4.2", text: "Write algorithms for insertion and deletion operations in a doubly linked list.", meta: {frequency: 3, marks: 10, years: ["2021(ND)", "2023(AM)", "2024(AM)"], priority: "highest"}},
                            {id: "Q1.4.3", text: "Explain circular linked list. Write a program to detect a loop in a linked list.", meta: {year: "2023(ND)", marks: 8}},
                            {id: "Q1.4.4", text: "Compare singly linked list, doubly linked list, and circular linked list with examples.", meta: {year: "2024(ND)", marks: 8}}
                        ]
                    }
                },
            },
            "Unit II": {
                name: "UNIT II: STACKS AND QUEUES",
                subtopics: {
                    "2.1": {
                        name: "Stack - Definition and Operations",
                        priority: "high",
                        questions: [
                            {id: "Q2.1.1", text: "Define stack data structure. Explain LIFO principle with diagram and real-world examples.", meta: {year: "2020(AM)", marks: 6}},
                            {id: "Q2.1.2", text: "Write algorithms for Push and Pop operations in a stack using arrays.", meta: {frequency: 5, marks: 8, years: ["2020(ND)", "2021(AM)", "2022(ND)", "2023(AM)", "2024(ND)"], priority: "highest"}},
                            {id: "Q2.1.3", text: "Implement a stack using linked list. Compare it with array implementation.", meta: {year: "2023(ND)", marks: 8}},
                            {id: "Q2.1.4", text: "What is stack overflow and underflow? How do you handle these conditions?", meta: {year: "2022(AM)", marks: 4}}
                        ]
                    },
                    "2.2": {
                        name: "Stack Applications",
                        priority: "high",
                        questions: [
                            {id: "Q2.2.1", text: "Convert infix expression to postfix using stack. Explain with example: A+B*C-D/E", meta: {frequency: 6, marks: 10, years: ["2020(AM)", "2021(AM)", "2021(ND)", "2022(ND)", "2023(AM)", "2024(AM)"], priority: "highest"}},
                            {id: "Q2.2.2", text: "Evaluate a postfix expression using stack. Show step-by-step execution for: 5 6 2 + * 12 4 / -", meta: {frequency: 4, marks: 8, years: ["2020(ND)", "2022(AM)", "2023(ND)", "2024(ND)"], priority: "highest"}},
                            {id: "Q2.2.3", text: "Explain how recursion uses stack internally. Write a recursive function to calculate factorial.", meta: {year: "2021(ND)", marks: 6}},
                            {id: "Q2.2.4", text: "Write an algorithm to check balanced parentheses in an expression using stack.", meta: {year: "2024(AM)", marks: 6}}
                        ]
                    },
                    "2.3": {
                        name: "Queue - Definition and Operations",
                        priority: "high",

        // Cookie management functions
        function setCookie(name, value, days) {
            const date = new Date();
            date.setTime(date.getTime() + (days * 24 * 60 * 60 * 1000));
            const expires = "expires=" + date.toUTCString();
            document.cookie = name + "=" + value + ";" + expires + ";path=/";
        }

        function getCookie(name) {
            const nameEQ = name + "=";
            const ca = document.cookie.split(';');
            for (let i = 0; i < ca.length; i++) {
                let c = ca[i];
                while (c.charAt(0) === ' ') c = c.substring(1, c.length);
                if (c.indexOf(nameEQ) === 0) return c.substring(nameEQ.length, c.length);
            }
            return null;
        }

        function saveProgress(data) {
            const jsonString = JSON.stringify(data);
            // Save to both localStorage and cookies for redundancy
            localStorage.setItem('ds_progress', jsonString);
            setCookie('ds_progress', jsonString, 365);
        }

        function loadProgress() {
            // Try localStorage first, then cookies
            let data = localStorage.getItem('ds_progress');
            if (!data) {
                data = getCookie('ds_progress');
                if (data) {
                    // Restore to localStorage if found in cookies
                    localStorage.setItem('ds_progress', data);
                }
            }
            return JSON.parse(data || '{}');
        }

        // Initialize the application
        let progressData = loadProgress();

        function renderQuestionBank() {
            const container = document.getElementById('questionBank');
            container.innerHTML = '';

            Object.entries(questionDatabase).forEach(([unitKey, unitData]) => {
                const unitSection = createUnitSection(unitKey, unitData);
                container.appendChild(unitSection);
            });

            updateStats();
        }

        function createUnitSection(unitKey, unitData) {
            const section = document.createElement('div');
            section.className = 'unit-section';
            
            const unitId = unitKey.replace(' ', '-').toLowerCase();
            const totalQuestions = Object.values(unitData.subtopics).reduce((sum, st) => sum + st.questions.length, 0);
            const completedQuestions = Object.values(unitData.subtopics).reduce((sum, st) => {
                return sum + st.questions.filter(q => progressData[q.id] === true).length;
            }, 0);

            const header = document.createElement('div');
            header.className = 'unit-header';
            header.innerHTML = `
                <div class="unit-title">
                    <input type="checkbox" class="unit-checkbox" data-unit="${unitId}" ${completedQuestions === totalQuestions && totalQuestions > 0 ? 'checked' : ''}>
                    <strong>${unitData.name}</strong>
                </div>
                <div class="unit-info">
                    <span>${Object.keys(unitData.subtopics).length} Subtopics | ${totalQuestions} Questions | ${completedQuestions} Done</span>
                    <span class="dropdown-icon">▼</span>
                </div>
            `;

            const content = document.createElement('div');
            content.className = 'unit-content';

            Object.entries(unitData.subtopics).forEach(([subtopicKey, subtopicData]) => {
                const subtopicSection = createSubtopicSection(unitKey, subtopicKey, subtopicData);
                content.appendChild(subtopicSection);
            });

            // Unit header click - toggle unit
            header.addEventListener('click', (e) => {
                if (e.target.type !== 'checkbox') {
                    header.classList.toggle('active');
                    content.classList.toggle('show');
                }
            });

            // Unit checkbox - mark all questions in unit
            const unitCheckbox = header.querySelector('.unit-checkbox');
            unitCheckbox.addEventListener('click', (e) => {
                e.stopPropagation();
                const checked = e.target.checked;
                Object.values(unitData.subtopics).forEach(st => {
                    st.questions.forEach(q => {
                        progressData[q.id] = checked;
                    });
                });
                saveProgress(progressData);
                renderQuestionBank();
            });

            section.appendChild(header);
            section.appendChild(content);
            return section;
        }

        function createSubtopicSection(unitKey, subtopicKey, subtopicData) {
            const section = document.createElement('div');
            section.className = 'subtopic-section';
            
            const totalQuestions = subtopicData.questions.length;
            const completedQuestions = subtopicData.questions.filter(q => progressData[q.id] === true).length;
            const priorityIcon = subtopicData.priority === 'high' ? '⭐⭐⭐' : subtopicData.priority === 'medium' ? '⭐⭐' : '⭐';

            const header = document.createElement('div');
            header.className = 'subtopic-header';
            header.innerHTML = `
                <div class="subtopic-title">
                    <input type="checkbox" class="subtopic-checkbox" data-subtopic="${unitKey}-${subtopicKey}" ${completedQuestions === totalQuestions && totalQuestions > 0 ? 'checked' : ''}>
                    <span>${subtopicKey}: ${subtopicData.name} ${priorityIcon}</span>
                </div>
                <div class="subtopic-stats">
                    ${totalQuestions} Questions | ${completedQuestions} Done
                </div>
            `;

            const content = document.createElement('div');
            content.className = 'subtopic-content';

            subtopicData.questions.forEach(question => {
                const questionItem = createQuestionItem(question);
                content.appendChild(questionItem);
            });

            // Subtopic header click - toggle subtopic
            header.addEventListener('click', (e) => {
                if (e.target.type !== 'checkbox') {
                    header.classList.toggle('active');
                    content.classList.toggle('show');
                }
            });

            // Subtopic checkbox - mark all questions in subtopic
            const subtopicCheckbox = header.querySelector('.subtopic-checkbox');
            subtopicCheckbox.addEventListener('click', (e) => {
                e.stopPropagation();
                const checked = e.target.checked;
                subtopicData.questions.forEach(q => {
                    progressData[q.id] = checked;
                });
                saveProgress(progressData);
                renderQuestionBank();
            });

            section.appendChild(header);
            section.appendChild(content);
            return section;
        }

        function createQuestionItem(question) {
            const item = document.createElement('div');
            item.className = 'question-item';
            item.dataset.questionId = question.id;
            
            if (progressData[question.id]) {
                item.classList.add('completed');
            }

            const header = document.createElement('div');
            header.className = 'question-header';
            
            const leftSection = document.createElement('div');
            leftSection.className = 'question-left';
            
            const checkbox = document.createElement('input');
            checkbox.type = 'checkbox';
            checkbox.className = 'question-checkbox';
            checkbox.checked = progressData[question.id] || false;
            
            checkbox.addEventListener('change', (e) => {
                progressData[question.id] = e.target.checked;
                saveProgress(progressData);
                item.classList.toggle('completed', e.target.checked);
                updateStats();
            });

            const questionId = document.createElement('div');
            questionId.className = 'question-id';
            questionId.textContent = question.id;

            const questionText = document.createElement('div');
            questionText.className = 'question-text';
            questionText.textContent = question.text;

            leftSection.appendChild(checkbox);
            leftSection.appendChild(questionId);
            leftSection.appendChild(questionText);

            const rightSection = document.createElement('div');
            rightSection.className = 'question-right';
            
            const meta = document.createElement('div');
            meta.className = 'question-meta';
            
            if (question.meta.priority === 'highest') {
                meta.innerHTML += `<span class="meta-badge badge-high">⭐ HIGHEST PRIORITY</span>`;
            }
            if (question.meta.frequency) {
                meta.innerHTML += `<span class="meta-badge badge-frequency">Asked ${question.meta.frequency}x</span>`;
            }
            if (question.meta.year) {
                meta.innerHTML += `<span class="meta-badge badge-year">📅 ${question.meta.year}</span>`;
            }
            if (question.meta.years) {
                question.meta.years.forEach(year => {
                    meta.innerHTML += `<span class="meta-badge badge-year">📅 ${year}</span>`;
                });
            }
            if (question.meta.marks) {
                meta.innerHTML += `<span class="meta-badge badge-marks">${question.meta.marks} marks</span>`;
            }

            rightSection.appendChild(meta);
            header.appendChild(leftSection);
            header.appendChild(rightSection);
            item.appendChild(header);
            return item;
        }

        function updateStats() {
            const totalQuestions = getTotalQuestions();
            const completedQuestions = Object.values(progressData).filter(v => v === true).length;
            const percent = totalQuestions > 0 ? Math.round((completedQuestions / totalQuestions) * 100) : 0;

            // Update header stats
            document.getElementById('totalQuestions').textContent = totalQuestions;
            document.getElementById('completedQuestions').textContent = completedQuestions;
            document.getElementById('progressPercent').textContent = percent + '%';

            // Update header progress bar and text
            document.getElementById('headerProgressFill').style.width = percent + '%';
            document.getElementById('headerProgressText').textContent = `${completedQuestions} of ${totalQuestions} completed`;
        }

        function getTotalQuestions() {
            let total = 0;
            Object.values(questionDatabase).forEach(unitData => {
                Object.values(unitData.subtopics).forEach(subtopicData => {
                    total += subtopicData.questions.length;
                });
            });
            return total;
        }

        // Control buttons
        document.getElementById('expandAll').addEventListener('click', () => {
            document.querySelectorAll('.unit-header').forEach(h => {
                h.classList.add('active');
                h.nextElementSibling.classList.add('show');
            });
            document.querySelectorAll('.subtopic-header').forEach(h => {
                h.classList.add('active');
                h.nextElementSibling.classList.add('show');
            });
        });

        document.getElementById('collapseAll').addEventListener('click', () => {
            document.querySelectorAll('.unit-header').forEach(h => {
                h.classList.remove('active');
                h.nextElementSibling.classList.remove('show');
            });
            document.querySelectorAll('.subtopic-header').forEach(h => {
                h.classList.remove('active');
                h.nextElementSibling.classList.remove('show');
            });
        });

        document.getElementById('resetProgress').addEventListener('click', () => {
            if (confirm('Are you sure you want to reset all progress? This cannot be undone.')) {
                progressData = {};
                saveProgress(progressData);
                renderQuestionBank();
            }
        });

        // Search and filters
        document.getElementById('searchBox').addEventListener('input', applyFilters);
        document.getElementById('unitFilter').addEventListener('change', applyFilters);
        document.getElementById('priorityFilter').addEventListener('change', applyFilters);
        document.getElementById('yearFilter').addEventListener('change', applyFilters);

        function applyFilters() {
            const search = document.getElementById('searchBox').value.toLowerCase();
            const unitFilter = document.getElementById('unitFilter').value;
            const priorityFilter = document.getElementById('priorityFilter').value;
            const yearFilter = document.getElementById('yearFilter').value;

            document.querySelectorAll('.unit-section').forEach((unitSection, idx) => {
                const unitKey = Object.keys(questionDatabase)[idx];
                const showUnit = unitFilter === 'all' || unitFilter === unitKey;

                let unitHasResults = false;

                unitSection.querySelectorAll('.subtopic-section').forEach(subtopicSection => {
                    let subtopicHasResults = false;

                    subtopicSection.querySelectorAll('.question-item').forEach(questionItem => {
                        const text = questionItem.textContent.toLowerCase();
                        const matchesSearch = search === '' || text.includes(search);

                        let matchesPriority = true;
                        const hasMeta = questionItem.querySelector('.badge-high');
                        if (priorityFilter === 'high' && !hasMeta) matchesPriority = false;
                        
                        let matchesYear = true;
                        if (yearFilter !== 'all') {
                            matchesYear = text.includes(yearFilter);
                        }
                        
                        if (matchesSearch && matchesPriority && matchesYear && showUnit) {
                            questionItem.style.display = 'block';
                            subtopicHasResults = true;
                            unitHasResults = true;
                        } else {
                            questionItem.style.display = 'none';
                        }
                    });

                    subtopicSection.style.display = subtopicHasResults ? 'block' : 'none';
                });

                unitSection.style.display = unitHasResults ? 'block' : 'none';
            });

            // Auto-expand if filtering
            if (search !== '' || unitFilter !== 'all' || priorityFilter !== 'all' || yearFilter !== 'all') {
                document.querySelectorAll('.unit-header').forEach(h => {
                    if (h.parentElement.style.display !== 'none') {
                        h.classList.add('active');
                        h.nextElementSibling.classList.add('show');
                    }
                });
                document.querySelectorAll('.subtopic-header').forEach(h => {
                    if (h.parentElement.style.display !== 'none') {
                        h.classList.add('active');
                        h.nextElementSibling.classList.add('show');
                    }
                });
            }
        }

        // Initialize
        renderQuestionBank();
        
        // Auto-expand first unit on load
        setTimeout(() => {
            const firstUnit = document.querySelector('.unit-header');
            if (firstUnit) {
                firstUnit.classList.add('active');
                firstUnit.nextElementSibling.classList.add('show');
            }
        }, 100);
    </script>
</body>
</html>
